name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: silt
          POSTGRES_PASSWORD: silt
          POSTGRES_DB: silt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U silt" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://silt:silt@localhost:5432/silt_test
      TEST_DATABASE_URL: postgresql://silt:silt@localhost:5432/silt_test
      PAYMENTS_MOCK_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: silt
          POSTGRES_PASSWORD: silt
          POSTGRES_DB: silt
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U silt" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://silt:silt@localhost:5432/silt
      PAYMENTS_MOCK_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy && npx prisma db seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
