# Render Blueprint: demo stand (site + database), deploys automatically on every push to main.
# Render dashboard → New → Blueprint → select this repository.
databases:
  - name: silt-db
    plan: free
    databaseName: silt
    user: silt

services:
  - type: web
    name: silt
    runtime: docker
    plan: free
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: silt-db
          property: connectionString
      # Demo stand: production build, test payments allowed (no real money).
      - key: APP_ENV
        value: staging
      - key: PAYMENTS_MOCK_ENABLED
        value: 'true'
      - key: SEED_ON_EMPTY
        value: 'true'
      - key: TRUST_PROXY
        value: '1'
      # Generated by Render; see them in the service's Environment tab.
      - key: APP_SECRET
        generateValue: true
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: SEED_STAFF_PASSWORD
        generateValue: true
